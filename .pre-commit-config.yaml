repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        types_or: [python]
        language: system

      - id: mypy
        name: mypy
        entry: uv run mypy
        types_or: [python]
        language: system

      - id: pyright
        name: pyright
        entry: uv run pyright
        types_or: [python]
        language: system

      - id: pylint
        name: pylint
        entry: uv run pylint --score no --output-format colorized
        types_or: [python]
        language: system
