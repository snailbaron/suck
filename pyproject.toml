[project]
name = "suck"
version = "0.1.0"
description = "Download a bunch of files providing checksums"
readme = "README.md"
authors = [
    { name = "snailbaron", email = "snailbaron@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.2",
    "colorama>=0.4.6",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
]

[project.scripts]
suck = "suck.cli:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pylint>=4.0.3",
    "pyright>=1.1.407",
    "ruff>=0.14.5",
    "types-aiofiles>=25.1.0.20251011",
    "types-pyyaml>=6.0.12.20250915",
    "types-tqdm>=4.67.0.20250809",
]

[tool.mypy]
strict = true

[tool.pyright]
strict = ["**"]
